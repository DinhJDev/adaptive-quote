services:
  postgres:
    image: postgres:18.3
    environment:
      POSTGRES_DB: adaptive_quote
      POSTGRES_USER: quote
      POSTGRES_PASSWORD: adaptive_quote_local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quote -d adaptive_quote"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
